// Flyway Gradle 플러그인은 buildscript classpath에서 별도로 동작하므로 PostgreSQL 드라이버를 여기서도 선언해야 한다.
buildscript {
	dependencies {
		classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
		classpath 'org.postgresql:postgresql:42.7.4'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// database/scripts/migrate.sh 전용 — 앱 부팅 없이 Flyway 마이그레이션만 실행하기 위해 추가.
	// flyway-core 버전은 spring-boot-starter-flyway가 관리하는 버전(12.4.0)과 맞춘다.
	id 'org.flywaydb.flyway' version '12.4.0'
}

group = 'com.alrdream'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 로컬 개발용 자동 재시작(hot reload) — 배포 JAR에는 포함되지 않는다(developmentOnly).
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	// 자체 발급 Access/Refresh JWT 서명·파싱
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// [03] §4-5 Google/Apple 소셜 로그인 — Frontend(Expo 모바일)가 각 provider SDK로 발급받은 ID 토큰을
	// 백엔드가 검증하는 방식(모바일 앱에 적합, Spring의 OAuth2Client 리다이렉트 플로우는 서버 렌더링 웹에 더 맞음).
	implementation 'com.google.api-client:google-api-client:2.8.0'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.3'
	// danfickle/openhtmltopdf(com.openhtmltopdf)는 2022년 이후 방치됨 — 활발히 관리되는 포크(io.github.openhtmltopdf) 사용
	implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.66'
	// [03] §4-6 Supabase Storage는 S3 호환 API — AWS SDK v2 S3 클라이언트로 업로드/서명 URL 발급.
	implementation platform('software.amazon.awssdk:bom:2.29.52')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jpa'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// database/scripts/migrate.sh 전용 설정. url/user/password/target은 스크립트가 FLYWAY_* 환경변수로 주입한다
// (Flyway는 이 환경변수들을 기본 지원 — 자격증명을 build.gradle에 하드코딩하지 않기 위함).
flyway {
	locations = ['filesystem:../database/migarations']
}

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # Supabase Session Pooler(Supavisor)는 pool_size=15로 전체 프로젝트 공유 — HikariCP 기본값(10)은
      # 앱 인스턴스 하나만으로도 이 예산 대부분을 차지해 다른 연결(psql, 다른 인스턴스 등)을 막을 수 있다.
      # Render 무료 인스턴스는 0.1 vCPU라 애초에 동시 커넥션이 많이 필요하지도 않다.
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    # 로컬/`./gradlew bootRun` 기준 상대 경로 (working dir = backend/).
    # Docker 이미지에서는 database/migarations를 이미지에 복사해 경로를 재조정한다 (Phase 01).
    locations: filesystem:../database/migarations

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # Redis는 아직 배포 대상 호스팅이 정해지지 않음(로컬 docker-compose만 존재) — Phase 03에서 재검토
      enabled: false

# jwt/oauth는 Phase 03에서 실제 코드와 연동 완료. ai/storage/portone은 각 도메인 Phase(06/09/11)에서 연동 예정 —
# 지금은 [03] 설계 문서에 맞춰 설정 슬롯만 정의해둔다.
app:
  security:
    # AES-256-GCM 키(Base64, 32바이트) — [03] §5 암호화 대상 컬럼에 사용. `openssl rand -base64 32`로 생성.
    encryption-key: ${DATA_ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity-seconds: 1800    # 30분
    refresh-token-validity-seconds: 1209600  # 14일
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_OAUTH_CLIENT_ID:}
      team-id: ${APPLE_OAUTH_TEAM_ID:}
      key-id: ${APPLE_OAUTH_KEY_ID:}
      private-key: ${APPLE_OAUTH_PRIVATE_KEY:}
  ai:
    claude:
      api-key: ${CLAUDE_API_KEY:}
  storage:
    supabase:
      endpoint: ${SUPABASE_STORAGE_ENDPOINT:}
      bucket: ${SUPABASE_STORAGE_BUCKET:}
      access-key: ${SUPABASE_STORAGE_ACCESS_KEY:}
      secret-key: ${SUPABASE_STORAGE_SECRET_KEY:}
  portone:
    api-secret: ${PORTONE_API_SECRET:}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    channel-key: ${PORTONE_CHANNEL_KEY:}

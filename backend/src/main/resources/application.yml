spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # Supabase Session Pooler(Supavisor)는 pool_size=15로 전체 프로젝트 공유 — HikariCP 기본값(10)은
      # 앱 인스턴스 하나만으로도 이 예산 대부분을 차지해 다른 연결(psql, 다른 인스턴스 등)을 막을 수 있다.
      # Render 무료 인스턴스는 0.1 vCPU라 애초에 동시 커넥션이 많이 필요하지도 않다.
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    # 로컬/`./gradlew bootRun` 기준 상대 경로 (working dir = backend/).
    # Docker 이미지에서는 database/migarations를 이미지에 복사해 경로를 재조정한다 (Phase 01).
    locations: filesystem:../database/migarations
    # 마이그레이션에서 ${...} 플레이스홀더 치환 기능을 쓰지 않는다 — V5가 저장하는 JSON Schema 리터럴이
    # 우연히 "${"로 시작하는 부분을 포함해(dollar-quote 태그 바로 뒤에 JSON "{" 가 와서) 플레이스홀더로
    # 오인되는 문제가 실제로 있었다. 이 프로젝트는 플레이스홀더를 쓸 계획이 없어 아예 꺼서 이 충돌 가능성 자체를 없앤다.
    placeholder-replacement: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # Phase 12부터 Render Key Value로 배포(render.yaml) — 로그인/로그아웃이 Redis에 강하게 의존하므로
      # (RefreshTokenStore) 헬스체크에도 반영해 Redis 장애 시 healthCheckPath가 실제로 unhealthy를 반환하게 한다.
      enabled: true

# jwt/oauth는 Phase 03에서 실제 코드와 연동 완료. ai/storage/portone은 각 도메인 Phase(06/09/11)에서 연동 예정 —
# 지금은 [03] 설계 문서에 맞춰 설정 슬롯만 정의해둔다.
app:
  cors:
    # Admin(Vite)/Frontend(Expo)가 브라우저에서 이 API를 직접 호출하므로 필요 (Phase 12부터). 쉼표 구분,
    # 배포 도메인이 늘어나면 env로 덧붙인다. 로컬 개발 기본값: Admin(Vite 기본 포트), Frontend(Expo web 기본 포트).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}
  security:
    # AES-256-GCM 키(Base64, 32바이트) — [03] §5 암호화 대상 컬럼에 사용. `openssl rand -base64 32`로 생성.
    encryption-key: ${DATA_ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity-seconds: 1800    # 30분
    refresh-token-validity-seconds: 1209600  # 14일
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_OAUTH_CLIENT_ID:}
      team-id: ${APPLE_OAUTH_TEAM_ID:}
      key-id: ${APPLE_OAUTH_KEY_ID:}
      private-key: ${APPLE_OAUTH_PRIVATE_KEY:}
  ai:
    claude:
      api-key: ${CLAUDE_API_KEY:}
      base-url: https://api.anthropic.com
      api-version: "2023-06-01"
      model: claude-sonnet-5
      max-tokens: 8000
      connect-timeout-seconds: 10
      # LLM 생성은 수십 초가 걸릴 수 있어 넉넉히 잡는다 — Virtual Thread 비동기 Job 안에서 실행되므로
      # 요청 스레드를 오래 붙잡지 않는다 (Phase 06, AiGenerationJobService).
      read-timeout-seconds: 120
    # [01] 13번 — FREE 플랜의 월별 AI 생성 횟수 제한. Phase 12부터 free_tier_settings 테이블(Admin이 조정)로
    # 이관 — 여기 고정값은 더 이상 쓰지 않는다(FreeTierSettingService).
  storage:
    supabase:
      endpoint: ${SUPABASE_STORAGE_ENDPOINT:}
      bucket: ${SUPABASE_STORAGE_BUCKET:}
      access-key: ${SUPABASE_STORAGE_ACCESS_KEY:}
      secret-key: ${SUPABASE_STORAGE_SECRET_KEY:}
      # SigV4 서명에 필요한 값 — Supabase Storage는 실제 리전 검증 없이 프로젝트 리전과만 맞으면 된다.
      # SUPABASE_DB_URL의 풀러 호스트(aws-1-ap-northeast-2)로 확인한 프로젝트 리전.
      region: ${SUPABASE_STORAGE_REGION:ap-northeast-2}
      # 다운로드 서명 URL 유효 시간.
      signed-url-ttl-minutes: 15
  portone:
    api-secret: ${PORTONE_API_SECRET:}
    api-base: https://api.portone.io
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    channel-key: ${PORTONE_CHANNEL_KEY:}
    # [01] 13번 "이후" BM — Pro 구독 월 요금. 문서에 금액이 명시돼 있지 않아 임의로 정한 값.
    pro-monthly-price-krw: 9900

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>설계 문서</title>
	<style>
		@page { size: A4; margin: 28mm 20mm; }
		body { font-family: 'Noto Sans KR', sans-serif; font-size: 10.5pt; line-height: 1.6; color: #222; }
		h1.doc-title { font-size: 20pt; margin: 0 0 4mm; }
		p.doc-subtitle { color: #666; margin: 0 0 12mm; font-size: 9.5pt; }
		h2 { font-size: 13pt; border-bottom: 1.5pt solid #333; padding-bottom: 2mm; margin: 10mm 0 4mm; }
		p { margin: 0 0 3mm; }
		ul { margin: 0 0 3mm; padding-left: 5mm; }
		li { margin-bottom: 1.5mm; }
		table.spec { width: 100%; border-collapse: collapse; margin-top: 2mm; table-layout: fixed; }
		table.spec th, table.spec td { border: 0.5pt solid #ccc; padding: 2.5mm; text-align: left; vertical-align: top; font-size: 10pt; word-wrap: break-word; }
		table.spec th { background: #f2f2f2; }
		table.spec th.col-feature { width: 32mm; }
		table.spec th.col-priority { width: 18mm; }
		table.spec th.col-phase { width: 22mm; }
	</style>
</head>
<body>
	<h1 class="doc-title">설계 문서</h1>
	<p class="doc-subtitle">알려드림 · 설계 (v<span th:text="${versionNo}">1</span>)</p>

	<h2>1. 기능 명세</h2>
	<table class="spec">
		<tr>
			<th class="col-feature">기능</th>
			<th class="col-priority">우선순위</th>
			<th>설명</th>
		</tr>
		<tr th:each="feature : ${content.feature_specification}">
			<td th:text="${feature.feature}"></td>
			<td th:text="${feature.priority}"></td>
			<td th:text="${feature.description}"></td>
		</tr>
	</table>

	<h2>2. MVP 정의</h2>
	<p><strong>포함 범위: </strong><span th:text="${content.mvp_definition.scope}"></span></p>
	<p><strong>이후 반영 항목: </strong><span th:text="${content.mvp_definition.excluded_for_later}"></span></p>

	<h2>3. 기술 아키텍처</h2>
	<p><strong>권장 기술 스택: </strong><span th:text="${content.technical_architecture.recommended_stack}"></span></p>
	<p><strong>아키텍처 개요: </strong><span th:text="${content.technical_architecture.architecture_overview}"></span></p>
	<p><strong>제약 반영: </strong><span th:text="${content.technical_architecture.constraints_reflected}"></span></p>

	<h2>4. 플랫폼 계획</h2>
	<p><strong>우선 출시 플랫폼: </strong><span th:text="${content.platform_plan.primary_platform}"></span></p>
	<p><strong>선정 이유: </strong><span th:text="${content.platform_plan.rationale}"></span></p>

	<h2>5. 데이터 &amp; 개인정보</h2>
	<p><strong>다루는 민감 데이터: </strong><span th:text="${content.data_and_privacy.sensitive_data_handled}"></span></p>
	<p><strong>보호 방안: </strong><span th:text="${content.data_and_privacy.protection_measures}"></span></p>

	<h2>6. 화면/기능 구조</h2>
	<ul>
		<li th:each="block : ${content.system_structure}" th:text="${block}"></li>
	</ul>

	<h2>7. 개발 계획</h2>
	<table class="spec">
		<tr>
			<th class="col-phase">단계</th>
			<th>작업</th>
		</tr>
		<tr th:each="step : ${content.development_plan}">
			<td th:text="${step.phase}"></td>
			<td th:text="${step.tasks}"></td>
		</tr>
	</table>
</body>
</html>
